substitutions:
  _REGION: asia-southeast1
  _SERVICE_NAME: chatbot-rag
  _JOB_NAME: rag-file-process
  _AR_REPO: tree-rag
  _SERVICE_IMAGE_NAME: tree-rag-service
  _JOB_IMAGE_NAME: tree-rag-job
  _DEPLOY_SERVICE: "true"
  _DEPLOY_JOB: "true"

steps:
  # 1. Build the Service Image
  - name: gcr.io/cloud-builders/docker
    id: Build service image
    waitFor: ['-']
    args:
      - build
      - --file
      - Dockerfile
      - --build-arg
      - REQUIREMENTS_FILE=requirements-service.txt
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_IMAGE_NAME}:$COMMIT_SHA
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_IMAGE_NAME}:latest
      - .

  # 2. Build the Job Image (parallel with service build)
  - name: gcr.io/cloud-builders/docker
    id: Build job image
    waitFor: ['-']
    entrypoint: bash
    args:
      - -c
      - |
        docker build \
          --file Dockerfile \
          --build-arg REQUIREMENTS_FILE=requirements-job.txt \
          --build-arg HF_TOKEN=$$HF_TOKEN \
          --tag ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_JOB_IMAGE_NAME}:$COMMIT_SHA \
          --tag ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_JOB_IMAGE_NAME}:latest \
          .
    secretEnv: ['HF_TOKEN']

  # 3. Push Service Image to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    id: Push service image
    waitFor: ['Build service image']
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_IMAGE_NAME}']

  # 4. Push Job Image to Artifact Registry (parallel with service push)
  - name: gcr.io/cloud-builders/docker
    id: Push job image
    waitFor: ['Build job image']
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_JOB_IMAGE_NAME}']

  # 5. Deploy Cloud Run service
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: Deploy Cloud Run service
    waitFor: ['Push service image']
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ "${_DEPLOY_SERVICE}" == "true" ]]; then
          gcloud run deploy "${_SERVICE_NAME}" \
            --region="${_REGION}" \
            --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_IMAGE_NAME}:$COMMIT_SHA" \
            --platform=managed \
            --update-secrets=DATABASE_URL=DATABASE_URL:latest \
            --remove-env-vars=INSTANCE_CONNECTION_NAME,DB_USER,DB_NAME
        else
          echo "Skipping service deploy"
        fi

  # 6. Update or Create Cloud Run job (parallel with service deploy)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: Update Cloud Run job
    waitFor: ['Push job image']
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ "${_DEPLOY_JOB}" == "true" ]]; then
          gcloud run jobs deploy "${_JOB_NAME}" \
            --region="${_REGION}" \
            --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_JOB_IMAGE_NAME}:$COMMIT_SHA" \
            --command="python" \
            --args="job_runner.py" \
            --update-secrets=DATABASE_URL=DATABASE_URL:latest \
            --remove-env-vars=INSTANCE_CONNECTION_NAME,DB_USER,DB_NAME
        else
          echo "Skipping job update"
        fi

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/HF_TOKEN/versions/latest
      env: 'HF_TOKEN'

timeout: 3600s

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
