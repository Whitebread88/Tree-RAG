substitutions:
  _REGION: asia-southeast1
  _SERVICE_NAME: chatbot-rag
  _JOB_NAME: rag-file-process
  _AR_REPO: tree-rag
  _SERVICE_IMAGE_NAME: tree-rag-service
  _JOB_IMAGE_NAME: tree-rag-job
  _DEPLOY_SERVICE: "true"
  _DEPLOY_JOB: "true"
  
steps:
  # 1. Build the Service Image
  - name: gcr.io/cloud-builders/docker
    id: Build service image
    args:
      - build
      - --file
      - Dockerfile
      - --build-arg
      - REQUIREMENTS_FILE=requirements-service.txt
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_IMAGE_NAME}:$COMMIT_SHA
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_IMAGE_NAME}:latest
      - .

  # 2. Build the Job Image
  - name: gcr.io/cloud-builders/docker
    id: Build job image
    args:
      - build
      - --file
      - Dockerfile
      - --build-arg
      - REQUIREMENTS_FILE=requirements-job.txt
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_JOB_IMAGE_NAME}:$COMMIT_SHA
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_JOB_IMAGE_NAME}:latest
      - .

  # 3. Push Service Image to Artifact Registry
  # Explicit push ensures the image is available for the deploy steps below
  - name: gcr.io/cloud-builders/docker
    id: Push service image
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_IMAGE_NAME}']

  # 4. Push Job Image to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    id: Push job image
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_JOB_IMAGE_NAME}']

  # 5. Deploy Cloud Run service
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: Deploy Cloud Run service
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ "${_DEPLOY_SERVICE}" == "true" ]]; then
          gcloud run deploy "${_SERVICE_NAME}" \
            --region="${_REGION}" \
            --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_IMAGE_NAME}:$COMMIT_SHA" \
            --platform=managed
        else
          echo "Skipping service deploy"
        fi

  # 6. Update or Create Cloud Run job
  # Overrides default entrypoint/CMD to run the python script instead of the web server
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: Update Cloud Run job
    entrypoint: bash
    args:
      - -ceu
      - |
        if [[ "${_DEPLOY_JOB}" == "true" ]]; then
          gcloud run jobs deploy "${_JOB_NAME}" \
            --region="${_REGION}" \
            --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_JOB_IMAGE_NAME}:$COMMIT_SHA" \
            --command="python" \
            --args="job_runner.py"
        else
          echo "Skipping job update"
        fi

# Images listed here help with build metadata and UI visibility in Google Cloud Console
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_IMAGE_NAME}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_IMAGE_NAME}:latest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_JOB_IMAGE_NAME}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_JOB_IMAGE_NAME}:latest

options:
  logging: CLOUD_LOGGING_ONLY
